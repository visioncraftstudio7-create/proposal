<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proposal</title>

        <style>
        *{
            margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:Georgia, serif;
        }

        body{
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                background:linear-gradient(135deg,#ff8c00,#ff6b00);
                overflow:hidden;
            }

        .container{
                    text-align:center;
                    color:white;
                }

        h1{
            font-size:55px;
            margin-bottom:10px;
            }

        .name{
                font-size:45px;
                font-weight:bold;
                margin-bottom:15px;
                }

        .from{
            font-size:14px;
            opacity:.9;
            margin-bottom:30px;
            }

        .btn{
            border:none;
            padding:15px 40px;
            border-radius:40px;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;
            }

        #yes{
            background:#ff3eb5;
            color:white;
            box-shadow:0 0 20px rgba(255,62,181,.8);
            }

        #no{
            position:absolute;
            top:35%;
            left:60%;
            background:#ffd54f;
            color:white;
            }

        .note{
            margin-top:60px;
            background:rgba(255,255,255,.2);
            padding:10px 20px;
            border-radius:30px;
            display:inline-block;
            font-size:14px;
            }
    </style>
</head>

<body>

    <div class="container">
    <h1>Aapka beta golu aapke important hai...?</h1>

    <div class="name">Akash 💖</div>

    <div class="from">From: Akash Singh </div>

    <button id="yes" class="btn">yes</button>

    <div class="note">
    This button runs away because it knows you want to say yes 😆
    </div>
    </div>

    <button id="no" class="btn">No 👀</button>

    <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    });

    document.getElementById("yes").onclick = () => {
    document.body.innerHTML = `
    <div style="
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff8c00,#ff6b00);
    color:white;
    font-size:60px;
    font-family:Georgia;
    ">
    ❤️ golu khuss huaaa  ❤️
    </div>`;
    };
    </script>

</body>
</html>
